[project]
name = "device-tools"
authors = [{ name = "Lennard Beers", email = "l.beers@outlook.de" }]
maintainers = [{ name = "Lennard Beers", email = "l.beers@outlook.de" }]
license = { file = "LICENSE.md" }
keywords = [
    "homeassistant",
    "custom-component",
    "device-tools",
    "device",
    "tools",
    "integration",
    "home-assistant",
    "home-assistant-custom-component",
    "home-assistant-integration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
description = "A custom component for Home Assistant to create and modify devices."
readme = "README.md"
requires-python = ">=3.14.2"
version = "0.0.0"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "homeassistant==2026.9.3",
]
test = [
    "pytest-homeassistant-custom-component==0.13.366",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/eulemitkeule/device-tools"
Documentation = "https://github.com/eulemitkeule/device-tools/blob/master/README.md"
Changelog = "https://github.com/EuleMitKeule/device-tools/releases"
Issues = "https://github.com/eulemitkeule/device-tools/issues"

[tool.uv]
package = false

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["custom_components"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/device_tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "FLY",
    "I",
    "LOG",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "T20",
    "TC",
    "UP",
    "W",
]
ignore = [
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
known-third-party = ["homeassistant"]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["D", "ARG", "PLC0415"]
